name: Daily Hotspot Collect

on:
  # 每天北京时间早上 9:00 自动运行（UTC 01:00）
  schedule:
    - cron: '0 1 * * *'
  # 也可以手动触发（从 GitHub 页面点一下就跑）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run hotspot collection
        run: |
          cd scripts
          python daily_hotspot_agent.py --output-dir ../output
        continue-on-error: true

      - name: Merge master table
        run: |
          python merge_master_table.py --output-dir output
        continue-on-error: true

      - name: Generate static site data
        run: |
          python generate_static.py --output-dir output --site-dir docs

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ output/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "📊 daily update: $(date +%Y-%m-%d)"
          git push

      # 部署到 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
